name: Installation or switching problem
description: Voka does not appear, cannot be selected, or does not type
labels: [install]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Status output
      description: Output of `"/Library/Input Methods/Voka.app/Contents/MacOS/VokaIME" --input-source-status` (use `~/Library/…` if you built Voka from source)
      render: json
