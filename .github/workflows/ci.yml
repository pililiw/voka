name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Behaviour spec
        run: bash eval/run.sh eval/replay.ts
      - name: Bundle parity (Node)
        run: npm run build:engine && node eval/host-smoke.cjs
      - name: Swift tests (JavaScriptCore parity)
        run: cd macos && swift test
      - name: Build the app
        run: npm run macos:build
